name: Network E2E Downloads Matrix

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1' # Weekly run on Monday at 04:00 UTC

jobs:
  e2e-matrix:
    name: Real Network E2E Matrix (macOS ARM64)
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Real Network E2E Test Suite
        env:
          POLYSAVER_RUN_NETWORK_E2E: "1"
        run: |
          cargo test --test e2e_real_downloads -- --ignored --nocapture
