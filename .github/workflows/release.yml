name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the v prefix (for example 2.0.0)'
        required: true
        type: string

concurrency:
  group: polysaver-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve and validate version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            raw_version="${INPUT_VERSION}"
          else
            raw_version="${REF_NAME#v}"
          fi

          if [[ ! "${raw_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid SemVer release version: ${raw_version}"
            exit 1
          fi

          echo "version=${raw_version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${raw_version}" >> "${GITHUB_OUTPUT}"

      - name: Verify project version consistency
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          package_version="$(node -p "require('./package.json').version")"
          cargo_version="$(awk '
            /^\[workspace\.package\]$/ { in_workspace = 1; next }
            /^\[/ { in_workspace = 0 }
            in_workspace && /^version = / {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)"

          for actual in "${tauri_version}" "${package_version}" "${cargo_version}"; do
            if [ "${actual}" != "${RELEASE_VERSION}" ]; then
              echo "::error::Project version ${actual} does not match release ${RELEASE_VERSION}"
              exit 1
            fi
          done

      - name: Verify updater signing secret exists
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not configured"
            exit 1
          fi

      - name: Refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::Release ${RELEASE_TAG} already exists"
            exit 1
          fi

  macos-arm64:
    name: macOS Apple Silicon
    needs: validate
    runs-on: macos-15
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      TARGET: aarch64-apple-darwin
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify native runner
        run: test "$(uname -m)" = "arm64"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: aarch64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: release-aarch64-apple-darwin

      - name: Cache native sidecars
        uses: actions/cache@v4
        with:
          path: |
            /tmp/polysaver_macos-aarch64_ffmpeg
            /tmp/polysaver_macos-aarch64_ffprobe
          key: polysaver-sidecars-macos-aarch64-ffmpeg-9.0.1-lame-3.100

      - name: Install dependencies
        run: |
          brew install x264 pkg-config
          npm ci

      - name: Import optional Apple certificate
        if: env.APPLE_CERTIFICATE != ''
        run: |
          set -euo pipefail
          certificate_path="${RUNNER_TEMP}/polysaver-certificate.p12"
          keychain_path="${RUNNER_TEMP}/polysaver-signing.keychain-db"
          printf '%s' "${APPLE_CERTIFICATE}" | base64 -D > "${certificate_path}"
          security create-keychain -p temporary "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p temporary "${keychain_path}"
          security import "${certificate_path}" -P "${APPLE_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain_path}"
          security set-key-partition-list -S apple-tool:,apple: -k temporary "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"

      - name: Prepare sidecars
        run: bash scripts/prepare-sidecars.sh macos-aarch64

      - name: Verify sidecar architecture
        run: |
          set -euo pipefail
          for binary in yt-dlp ffmpeg ffprobe; do
            lipo -archs "src-tauri/resources/bin/${binary}" | grep -qw arm64
          done

      - name: Build application, DMG and updater
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
        run: npx @tauri-apps/cli build --target "${TARGET}" --bundles dmg,app

      - name: Stage verified macOS ARM64 assets
        run: |
          set -euo pipefail
          bundle_root="target/${TARGET}/release/bundle"
          app_path="$(find "${bundle_root}/macos" -maxdepth 1 -type d -name '*.app' | head -n 1)"
          dmg_path="$(find "${bundle_root}/dmg" -maxdepth 1 -type f -name '*.dmg' | head -n 1)"
          updater_path="$(find "${bundle_root}/macos" -maxdepth 1 -type f -name '*.app.tar.gz' | head -n 1)"
          signature_path="${updater_path}.sig"

          for path in "${app_path}" "${dmg_path}" "${updater_path}" "${signature_path}"; do
            if [ -z "${path}" ] || [ ! -e "${path}" ]; then
              echo "::error::Missing macOS ARM64 release asset"
              exit 1
            fi
          done

          codesign --verify --deep --strict "${app_path}"
          hdiutil verify "${dmg_path}"

          mkdir -p release-out
          cp "${dmg_path}" "release-out/PolySaver_${RELEASE_VERSION}_macOS_arm64.dmg"
          cp "${updater_path}" "release-out/PolySaver_${RELEASE_VERSION}_macOS_arm64.app.tar.gz"
          cp "${signature_path}" "release-out/PolySaver_${RELEASE_VERSION}_macOS_arm64.app.tar.gz.sig"

      - name: Upload macOS ARM64 assets
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: release-out/*
          if-no-files-found: error
          retention-days: 2

  windows:
    name: Windows x64
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      TARGET: x86_64-pc-windows-msvc
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: release-x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Prepare sidecars
        run: bash scripts/prepare-sidecars.sh windows-x64

      - name: Verify sidecars
        run: |
          set -euo pipefail
          for binary in yt-dlp.exe ffmpeg.exe ffprobe.exe; do
            test "$(head -c 2 "src-tauri/resources/bin/${binary}")" = "MZ"
          done

      - name: Build EXE, MSI and updater signatures
        run: npx @tauri-apps/cli build --target "${TARGET}" --bundles nsis,msi

      - name: Stage verified Windows assets
        run: |
          set -euo pipefail
          bundle_root="target/${TARGET}/release/bundle"
          exe_path="$(find "${bundle_root}/nsis" -maxdepth 1 -type f -name '*.exe' | head -n 1)"
          msi_path="$(find "${bundle_root}/msi" -maxdepth 1 -type f -name '*.msi' | head -n 1)"

          for path in "${exe_path}" "${exe_path}.sig" "${msi_path}" "${msi_path}.sig"; do
            if [ -z "${path}" ] || [ ! -s "${path}" ]; then
              echo "::error::Missing Windows release asset: ${path}"
              exit 1
            fi
          done

          mkdir -p release-out
          cp "${exe_path}" "release-out/PolySaver_${RELEASE_VERSION}_Windows_x64_Setup.exe"
          cp "${exe_path}.sig" "release-out/PolySaver_${RELEASE_VERSION}_Windows_x64_Setup.exe.sig"
          cp "${msi_path}" "release-out/PolySaver_${RELEASE_VERSION}_Windows_x64.msi"
          cp "${msi_path}.sig" "release-out/PolySaver_${RELEASE_VERSION}_Windows_x64.msi.sig"

      - name: Upload Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: release-out/*
          if-no-files-found: error
          retention-days: 2

  linux:
    name: Linux x64
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      TARGET: x86_64-unknown-linux-gnu
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            wget \
            xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: release-x86_64-unknown-linux-gnu

      - name: Install dependencies
        run: npm ci

      - name: Prepare sidecars
        run: bash scripts/prepare-sidecars.sh linux-x64

      - name: Verify sidecar architecture
        run: |
          set -euo pipefail
          for binary in yt-dlp ffmpeg ffprobe; do
            file "src-tauri/resources/bin/${binary}" | grep -q 'x86-64'
          done

      - name: Build AppImage, DEB and updater signature
        run: npx @tauri-apps/cli build --target "${TARGET}" --bundles appimage,deb

      - name: Stage verified Linux assets
        run: |
          set -euo pipefail
          bundle_root="target/${TARGET}/release/bundle"
          appimage_path="$(find "${bundle_root}/appimage" -maxdepth 1 -type f -name '*.AppImage' | head -n 1)"
          deb_path="$(find "${bundle_root}/deb" -maxdepth 1 -type f -name '*.deb' | head -n 1)"

          for path in "${appimage_path}" "${appimage_path}.sig" "${deb_path}"; do
            if [ -z "${path}" ] || [ ! -s "${path}" ]; then
              echo "::error::Missing Linux release asset: ${path}"
              exit 1
            fi
          done

          mkdir -p release-out
          cp "${appimage_path}" "release-out/PolySaver_${RELEASE_VERSION}_Linux_x64.AppImage"
          cp "${appimage_path}.sig" "release-out/PolySaver_${RELEASE_VERSION}_Linux_x64.AppImage.sig"
          cp "${deb_path}" "release-out/PolySaver_${RELEASE_VERSION}_Linux_x64.deb"

      - name: Upload Linux assets
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: release-out/*
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish complete release
    needs:
      - validate
      - macos-arm64
      - windows
      - linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download macOS ARM64 assets
        uses: actions/download-artifact@v4
        with:
          name: release-macos-arm64
          path: release-input/macos-arm64

      - name: Download Windows assets
        uses: actions/download-artifact@v4
        with:
          name: release-windows-x64
          path: release-input/windows

      - name: Download Linux assets
        uses: actions/download-artifact@v4
        with:
          name: release-linux-x64
          path: release-input/linux

      - name: Assemble and validate release
        run: |
          set -euo pipefail
          mkdir -p release-dist
          while IFS= read -r -d '' asset; do
            destination="release-dist/$(basename "${asset}")"
            if [ -e "${destination}" ]; then
              echo "::error::Duplicate release asset: $(basename "${asset}")"
              exit 1
            fi
            cp "${asset}" "${destination}"
          done < <(find release-input -type f -print0)

          node scripts/generate-release-metadata.mjs \
            release-dist \
            "${RELEASE_VERSION}" \
            "${RELEASE_TAG}" \
            "${GITHUB_REPOSITORY}"

      - name: Create complete draft release
        run: |
          set -euo pipefail
          notes_path="${RUNNER_TEMP}/release-notes.md"
          cat > "${notes_path}" <<EOF
          ## PolySaver ${RELEASE_VERSION}

          Téléchargez uniquement le fichier correspondant à votre système :

          - macOS 14+ avec puce Apple : PolySaver_${RELEASE_VERSION}_macOS_arm64.dmg
          - Windows : PolySaver_${RELEASE_VERSION}_Windows_x64_Setup.exe
          - Windows administré : PolySaver_${RELEASE_VERSION}_Windows_x64.msi
          - Linux x64 récent : PolySaver_${RELEASE_VERSION}_Linux_x64.AppImage
          - Ubuntu 22.04+, Debian 12+ et Linux Mint récent : PolySaver_${RELEASE_VERSION}_Linux_x64.deb

          Les autres fichiers servent aux mises à jour automatiques et à la vérification d’intégrité.
          EOF

          gh release create "${RELEASE_TAG}" \
            --title "PolySaver ${RELEASE_VERSION}" \
            --notes-file "${notes_path}" \
            --target "${GITHUB_SHA}" \
            --draft \
            release-dist/*

          touch "${RUNNER_TEMP}/polysaver-release-created"

      - name: Verify assets stored by GitHub
        run: |
          set -euo pipefail
          find release-dist -maxdepth 1 -type f -exec basename {} \; | sort > expected-assets.txt
          gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' | sort > github-assets.txt
          diff -u expected-assets.txt github-assets.txt

          mkdir -p downloaded-metadata
          gh release download "${RELEASE_TAG}" \
            --pattern latest.json \
            --pattern SHA256SUMS.txt \
            --dir downloaded-metadata
          cmp release-dist/latest.json downloaded-metadata/latest.json
          cmp release-dist/SHA256SUMS.txt downloaded-metadata/SHA256SUMS.txt

      - name: Publish release
        run: gh release edit "${RELEASE_TAG}" --draft=false --latest

      - name: Remove incomplete draft after a failure
        if: failure()
        run: |
          if [ -f "${RUNNER_TEMP}/polysaver-release-created" ]; then
            gh release delete "${RELEASE_TAG}" --yes >/dev/null 2>&1 || true
          fi
