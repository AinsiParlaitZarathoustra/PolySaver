name: Build Windows

on:
  workflow_call:
    inputs:
      version:
        description: 'Version string to verify and bundle (e.g. 0.1.0)'
        required: true
        type: string

jobs:
  build-windows-x64:
    name: Build Windows (x64)
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Node Dependencies
        run: npm ci

      - name: Provision Windows Sidecars
        run: bash scripts/prepare-sidecars.sh windows-x64

      - name: Build Tauri Windows Release Bundle
        run: npx @tauri-apps/cli build --bundles nsis

      - name: Verify Windows Installer & Executable
        run: |
          set -euo pipefail
          echo "=== Verifying Windows NSIS Installer ==="
          INSTALLER_PATH="$(find target/release/bundle/nsis -name '*.exe' | head -n 1)"
          if [ -z "${INSTALLER_PATH}" ] || [ ! -f "${INSTALLER_PATH}" ]; then
            echo "[ERROR] No NSIS installer found in target/release/bundle/nsis!"
            exit 1
          fi

          if [ ! -s "${INSTALLER_PATH}" ]; then
            echo "[ERROR] Windows installer ${INSTALLER_PATH} is empty!"
            exit 1
          fi

          echo "[OK] Found Windows installer: ${INSTALLER_PATH}"

          echo "=== Verifying Windows Sidecar Binaries ==="
          for bin in yt-dlp.exe ffmpeg.exe ffprobe.exe; do
            if [ ! -f "src-tauri/resources/bin/${bin}" ]; then
              echo "[ERROR] Missing expected sidecar: src-tauri/resources/bin/${bin}"
              exit 1
            fi
            # Verify PE header (MZ magic bytes)
            MAGIC="$(head -c 2 "src-tauri/resources/bin/${bin}")"
            if [ "${MAGIC}" != "MZ" ]; then
              echo "[ERROR] ${bin} is not a valid Windows PE binary (magic: ${MAGIC})!"
              exit 1
            fi
            echo "[OK] Verified Windows PE binary: ${bin}"
          done

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: polysaver-windows-x64
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 1
